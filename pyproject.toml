[project]
name = "price-touch-research"
version = "0.1.0"
description = "Realtime price-interval touch probability research platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-socks[asyncio]>=2.5,<3",
  "uvicorn[standard]>=0.31,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/price_touch"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
