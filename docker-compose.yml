services:
  app:
    build: .
    environment:
      PRICE_TOUCH_DATA_MODE: REPLAY
    ports:
      - "3000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 5s
      timeout: 2s
      retries: 12
